# /etc/nginx/sites-available/modelforge.conf
# ln -s /etc/nginx/sites-available/modelforge.conf /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

upstream gateway {
    server 127.0.0.1:9000;
    keepalive 32;
}

upstream web {
    server 127.0.0.1:9001;
    keepalive 16;
}

server {
    listen 80;
    server_name your-domain.com;  # ← replace with your domain or IP

    # Redirect HTTP → HTTPS (uncomment after certbot)
    # return 301 https://$host$request_uri;

    # --- Control plane (Next.js) ---
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Public API (OpenAI-compatible) ---
    location /v1/ {
        proxy_pass http://gateway/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming: disable buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        chunked_transfer_encoding on;
    }

    # --- Internal gateway routes (Next.js server → gateway) ---
    # Block external access; only allow from localhost
    location /internal/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://gateway/internal/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # --- Never expose gRPC port (9002) or llama-server ports (9100+) ---

    # Static assets cache
    location /_next/static/ {
        proxy_pass http://web/_next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location = /healthz {
        proxy_pass http://gateway/internal/health;
        access_log off;
    }

    client_max_body_size 10M;
}

# Uncomment after: sudo certbot --nginx -d your-domain.com
