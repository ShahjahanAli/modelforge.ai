services:
  postgres:
    image: postgres:16-alpine
    container_name: modelforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: modelforge
      POSTGRES_PASSWORD: modelforge
      POSTGRES_DB: modelforge
    ports:
      - "5432:5432"
    volumes:
      - modelforge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelforge -d modelforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: modelforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - modelforge_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  modelforge_pg:
  modelforge_redis:
