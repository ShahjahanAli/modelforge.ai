services:
  postgres:
    image: postgres:16-alpine
    container_name: modelforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: modelforge
      POSTGRES_PASSWORD: modelforge
      POSTGRES_DB: modelforge
    ports:
      - "5432:5432"
    volumes:
      - modelforge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelforge -d modelforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: modelforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - modelforge_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: ["redis-server", "--appendonly", "yes"]

  # Shared with client apps (e.g. Anusandhan): object storage for audio / artifacts
  minio:
    image: minio/minio:latest
    container_name: modelforge-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"
      - "9001:9001"
    volumes:
      - modelforge_minio:/data

  # Shared with client apps (e.g. Anusandhan): relationship graph
  neo4j:
    image: neo4j:5-community
    container_name: modelforge-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/modelforge
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - modelforge_neo4j:/data

volumes:
  modelforge_pg:
  modelforge_redis:
  modelforge_minio:
  modelforge_neo4j:
